services:
  - type: web
    name: iiscvibes-server
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: CLIENT_URL
        fromService:
          name: iiscvibes-client
          type: web
          property: url

  - type: web
    name: iiscvibes-client
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/build
    envVars:
      - key: NODE_ENV
        value: production
      - key: REACT_APP_API_URL
        fromService:
          name: iiscvibes-server
          type: web
          property: url
          envVarKey: API_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
